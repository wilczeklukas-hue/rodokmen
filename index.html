<style>

* { box-sizing: border-box; }

.top { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; justify-content: space-between; }

.plink { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font: inherit; text-align: left; }

.bar2 { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; justify-content: space-between; margin-top: 6px; }

.search { position: relative; }

  background: var(--bg); color: var(--ink); font: inherit; }

.view { position: absolute; inset: 0; display: none; }

#vp { position: absolute; left: 0; top: 0; bottom: 0; right: calc(var(--rw) + var(--evw)); overflow: hidden; touch-action: none; cursor: grab;

#treeview.noev #events { display: none; }
.tick { position: absolute; right: 8px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; transform: translateY(-50%); }
.tick.century { color: var(--ink); font-weight: 600; }
.evdot { position: absolute; left: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); transform: translateY(-50%); }
.evdot.major { background: var(--dot); width: 9px; height: 9px; left: 4px; }

.zoombar { position: absolute; left: calc((100% - var(--rw) - var(--evw)) / 2); bottom: max(12px, env(safe-area-inset-bottom)); transform: translateX(-50%);

.zoombar button { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 5px;
  min-width: 30px; height: 28px; cursor: pointer; padding: 0 8px; white-space: nowrap; }
.zoombar button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.zoombar input { width: 120px; }
.zoombar .pct { min-width: 44px; text-align: right; color: var(--muted); font-size: 12px; }
#detail { position: absolute; right: 0; top: 0; bottom: 0; width: 380px; max-width: 100%; background: var(--panel);
  border-left: 1px solid var(--line); box-shadow: -2px 0 8px rgba(0,0,0,.08); transform: translateX(105%);
  transition: transform .18s ease; z-index: 20; overflow-y: auto; padding: 16px 18px 80px; }
#detail.on { transform: none; }
#detail h2 { margin: 0 28px 2px 0; font-size: 19px; }
#detail .sub { color: var(--muted); margin-bottom: 10px; }
#detail .close { position: absolute; right: 10px; top: 10px; border: 0; background: none; color: var(--muted);
  font-size: 22px; cursor: pointer; line-height: 1; }
#detail dl { display: grid; grid-template-columns: 96px 1fr; gap: 4px 10px; margin: 8px 0 12px; }
#detail dt { color: var(--muted); }
#detail dd { margin: 0; overflow-wrap: anywhere; }
#detail h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 16px 0 6px; }
#detail ul { margin: 0; padding-left: 18px; overflow-wrap: anywhere; }
#detail ul.life { list-style: none; padding: 0; font-size: 13px; }
#detail ul.life li { display: grid; grid-template-columns: 74px 1fr; gap: 6px; padding: 2px 0; }
#detail ul.life span { color: var(--muted); font-variant-numeric: tabular-nums; }
a.p { color: var(--accent); cursor: pointer; text-decoration: none; }
a.p:hover { text-decoration: underline; }
.unk { color: var(--muted); font-style: italic; }
.badge { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 10px; color: #fff; margin-right: 6px; }
.scans { display: flex; flex-wrap: wrap; gap: 8px; }
.scans figure { margin: 0; width: 104px; cursor: zoom-in; }
.scans img { width: 104px; height: 78px; object-fit: cover; border: 1px solid var(--line); border-radius: 4px; }
.scans figcaption { font-size: 11px; color: var(--muted); }
/* scan viewer: fit to screen, click or button toggles full resolution */
#viewer { position: fixed; inset: 0; background: rgba(8,12,15,.94); display: flex; flex-direction: column; z-index: 50; }
#viewer .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: #e6ecef; padding: 10px 16px; font-size: 13px; }
#viewer .bar button { background: transparent; color: #e6ecef; border: 1px solid #5a6b74; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
#viewer .pane { flex: 1; overflow: auto; cursor: zoom-out; min-height: 0; }
#viewer .pane img { display: block; max-width: none; }
#viewer .pane.fit { display: flex; cursor: zoom-in; padding: 0 16px 16px; }
#viewer .pane.fit img { max-width: 100%; max-height: 100%; margin: auto; }
/* wider family circle */
#wideview, #mapview { overflow-y: auto; }
.wide { max-width: 980px; margin: 0 auto; padding: 16px; }
.wintro { color: var(--muted); margin: 0 0 10px; }
.wtools { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-bottom: 8px; }
.wtools select { font: inherit; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; }
.wide h3 { font-size: 16px; margin: 22px 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.fam { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c, var(--line)); border-radius: 8px; padding: 10px 14px; margin: 0 0 10px; }
.fam .fh { font-weight: 600; margin-bottom: 2px; }
.fam .fm { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
.fam ul { margin: 0; padding-left: 20px; }
.fam li { margin: 2px 0; }
.fam li.direct { font-weight: 600; }
.fam .tag { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 6px; }
.fam .none { color: var(--muted); font-style: italic; font-size: 13px; }
/* map tab */
.mapwrap { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 20px; }
.mapbox { position: relative; }

#map.drag { cursor: grabbing; }
#map .land { fill: var(--land); stroke: var(--edge); stroke-width: .6; vector-effect: non-scaling-stroke; }
#map .cz { fill: var(--land2); }
#map line { vector-effect: non-scaling-stroke; }
#map .cname { fill: var(--muted); font-size: calc(11px * var(--k, 1)); text-anchor: middle; opacity: .8; }

#map .plab { fill: var(--ink); font-size: calc(12px * var(--k, 1)); paint-order: stroke; stroke: var(--water); stroke-width: calc(3px * var(--k, 1)); }
.mapzoom { position: absolute; right: 8px; top: 8px; display: flex; gap: 4px; }
.mapzoom button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 5px; min-width: 28px; height: 28px; cursor: pointer; padding: 0 8px; }
.cap { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
.moves { margin: 10px 0 0; padding-left: 18px; font-size: 13px; }
.stories h3, .tl h3 { margin: 0 0 8px; font-size: 15px; }
.story { border-left: 4px solid var(--lc); padding: 4px 0 4px 10px; margin-bottom: 12px; }

.tl { margin-top: 18px; }
.tl ul { list-style: none; padding: 0; margin: 0; }
.tl li { display: grid; grid-template-columns: 48px 1fr; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--grid); }
.tl li span { color: var(--muted); font-variant-numeric: tabular-nums; }
.tl li.hist { color: var(--muted); }
.tl li.hist.major { color: var(--ink); }
.tl li.anc { font-weight: 600; }
footer.note { color: var(--muted); font-size: 12px; padding: 8px 16px 20px; max-width: 1100px; margin: 0 auto; }
@media (max-width: 720px) {
  :root { --rw: 40px; --evw: 100px; }
  .evl { font-size: 10.5px; left: 15px; overflow-wrap: break-word; hyphens: auto; }
  .zoombar { left: 50%; }
  .legend { flex-wrap: nowrap; overflow-x: auto; }
  .chips, .keys { flex-wrap: nowrap; white-space: nowrap; }
  .evl .l { display: none; }
  .evl .s { display: inline; }

  .evl.full .s { display: none; }
  .tick { right: 5px; font-size: 10.5px; }
  .mapwrap { grid-template-columns: 1fr; }

  #detail.on { transform: none; }
  .zoombar { gap: 4px; padding: 4px 6px; }
  .zoombar input { width: 48px; }
  .zoombar button { padding: 0 6px; min-width: 28px; }
  .zoombar .pct { display: none; }
  #z100 { display: none; }
  .search input { width: 150px; }
  #detail dl { grid-template-columns: 84px 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
/* animation tab (3D ancestors) */
#animview { background: #000; color: #f3ead8; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }

#animview canvas.drag { cursor: grabbing; }
#animview canvas.hot { cursor: pointer; }
.an-hud { position: absolute; left: 0; right: 0; top: 0; padding: 18px 16px 0; text-align: center; pointer-events: none;
  text-shadow: 0 1px 12px rgba(0,0,0,.9); }
.an-kick { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: #d9b46a; font-weight: 600; min-height: 1.4em; }
.an-num { font-size: clamp(44px, 9vw, 92px); line-height: 1.02; font-weight: 700; color: #fff4dc; font-variant-numeric: tabular-nums;
  letter-spacing: -.01em; margin-top: 4px; }
.an-q { font-size: clamp(14px, 2.1vw, 18px); color: #efe3c8; margin-top: 4px; }
.an-known { font-size: 13px; color: #b9a988; margin-top: 4px; min-height: 1.3em; }
.an-ruler { position: absolute; left: 16px; bottom: 58px; font-size: 12px; line-height: 1.55; pointer-events: none;
  font-variant-numeric: tabular-nums; color: #f3ead8; text-shadow: 0 1px 6px #000; }
.an-ruler div { display: grid; grid-template-columns: 3.4em 1.2em 4.6em auto; opacity: .14; transition: opacity .4s, color .4s; }

.an-ctl button:hover { border-color: #d9b46a; }

.an-lbl.root { font-size: 14px; font-weight: 600; color: #fff; transform: translate(-50%, 16px); }

.an-tip b { color: #fff; font-size: 13.5px; }

.an-sum { position: absolute; right: 16px; bottom: 44px; width: min(380px, calc(100% - 32px)); padding: 14px 34px 14px 16px; border-radius: 10px;

.an-sum p { margin: 0 0 7px; }

}
</style>

<body>
<header>
  <div class="top">
    <h1>Rodokmen Wilczek</h1>
    <div class="stats" id="stats"></div>
  </div>
  <div class="bar2">
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-view="treeview">Rodokmen</button>
      <button role="tab" aria-selected="false" data-view="wideview">Širší okruh</button>
      <button role="tab" aria-selected="false" data-view="mapview">Odkud jsme</button>
      <button role="tab" aria-selected="false" data-view="animview" id="tabAnim">Animace</button>
    </div>
    <div class="tools">
      <div class="search">
        <input id="q" type="search" placeholder="Hledat osobu…" autocomplete="off" aria-label="Hledat osobu">
        <div class="results" id="results"></div>
      </div>
      <button id="home" type="button" title="Zpět na začátek stromu"></button>
    </div>
  </div>
  <div class="legend" id="legend"><div class="chips" id="chips" role="group" aria-label="Zvýraznit větev"></div><div class="keys" id="keys"></div></div>
</header>
<main>
  <section class="view on" id="treeview">
    <div id="vp"><div id="world"></div></div>
    <div id="axis"><div id="ruler" aria-hidden="true"></div><div id="events" aria-label="Historické události"></div></div>
    <div class="zoombar">
      <button id="zout" title="Oddálit" aria-label="Oddálit">−</button>
      <input id="zrange" type="range" min="10" max="300" step="1" aria-label="Měřítko">
      <button id="zin" title="Přiblížit" aria-label="Přiblížit">+</button>
      <span class="pct" id="zpct"></span>
      <button id="zfit">Celý strom</button>
      <button id="z100" class="fit100">100 %</button>
      <button id="zev" aria-pressed="true" title="Zobrazit nebo skrýt sloupec historických událostí">Události</button>
    </div>
    <aside id="detail" aria-live="polite"></aside>
  </section>
  <section class="view" id="wideview">
    <div class="wide">
      <p class="wintro" id="wideIntro"></p>
      <div class="wtools">
        <label>Větev <select id="wLine"><option value="">všechny</option></select></label>
        <label><input type="checkbox" id="wOnly"> jen rodiny se známými sourozenci</label>
      </div>
      <div id="wideBody"></div>
    </div>
  </section>
  <section class="view" id="mapview">
    <div class="mapwrap">
      <div>
        <div class="mapbox">
          <svg id="map" role="img" aria-label="Mapa míst rodu"></svg>
          <div class="mapzoom" role="toolbar" aria-label="Přiblížení mapy">
            <button type="button" id="mzin" aria-label="Přiblížit mapu">+</button>
            <button type="button" id="mzout" aria-label="Oddálit mapu">−</button>
            <button type="button" id="mzreset">Celá mapa</button>

    "zao_r31: Marina dcera Jiřího Kani není ani VI 1739 – III 1741 a I–V 1743. Rodina Jiří Kijenka/Kijonka × Zuzana (Dětmarovice, stálí kmotři Karlik a Kolwas) měla děti Matouš 11. 9. 1739/40, Marianna 6. 2. 1743, Marina 29. 6. 1744 – „Kania“ (sňatek 1776, „Kanin“ 1781) by mohla být zkomolenina Kijenka/Kionka, ale oba zápisy píší jasně Kania → hypotéza K, nezapsáno.",

    "fs_old21 – RIZIKO: 27. 2. 1753 pohřbena v Dětmarovicích „Marina Patris Gregorij Kijenka Coloni Dittmersd. filia 7 ann.“ (DGS 5387446 sn49 P; D–M). Otec Řehoř, ne Jiří, a věk 7 (naší Marině by bylo 8¾), ale křest Mariny Řehořovy v I 1744 – VI 1748 nalezen nebyl a písař jinde Georg/Gregor zaměnil. Ztotožnění křtu 1744 s naší Marinou proto zůstává jen D. Zápis „Kiziel“ 1750 není Kijenka (M).",
    "fs_old23: křest Mariny Řehořovy (Řehoř Kijonka × Marina) VIII 1744 – XII 1746 není; Řehoř tam jako otec nefiguruje vůbec (ač syn Pavel † 1749 ve 3 letech). Pohřby III 1753 – VIII 1757 bez Jiřího, Zuzany i Mariny Jiřího Kijenky. Otázka, zda pohřeb 1753 není naše Marina, zůstává otevřená – ztotožnění D.",
    "fs_old25: Jiří Kyjenka × Zuzana pokřtili už [6./8.] 2. 1743 dceru Mariannu (DGS 5387436 FS87 L, M) – druhá Marina 29. 6. 1744 naznačuje, že starší zemřela (neověřeno). Řehoř Kijonka nemá v křtech VI 1742 – VI 1748 jiné dítě než Ondřeje (1747) → jeho Marina († 1753) i Pavel († 1749) tu pokřtěni nejsou; možná záměna Georg/Gregor (K). Pohřby IX 1757 – I 1760 bez Mariny, Zuzany i Jiřího Kijenky.",
    "fs_old27: STARŠÍ SESTRA ZEMŘELA – 21. 2. 1743: „obijt Marina in sua infantia filia Georgij Kyjonka Dittm.“ (DGS 5387446 sn26 P; M čtení ověřeno koordinátorem) = Marianna pokř. [6./8.] 2. 1743. Proto jméno znovu 29. 6. 1744 – ztotožnění křtu 1744 s naší Marinou posíleno (D). Marina 1744 nezemřela do VII 1745 ani 1753–III 1763 (mimo pohřeb „Gregorij“ 1753). Zbývá rozpor s věkem 43 při úmrtí 1791.",
    "fs_old59: zápis 10. 10. 1778 „Susanna … 72“ (dříve čten jako vdova po Georgovi Ka…) je ve skutečnosti „Susanna vormahls Joachim Gura weyl. Müllers, nunmehro Joannis Kapusta Müllers Eheweib“ – NE matka Mariny."

   "notes": [
    "Otec Mariny Hanuškové (sňatek dcery 1776). Rok narození je odhad.",
    "fs_old18: manželka Zuzana (křest dcery Mariny 29. 6. 1744, D); 21. 7. 1750 dcera Anna s matkou Annou – možná 2. manželka (K).",
    "fs_old112: Jiří Kijonka z Dětmarovic má 1727 a 1729 manželku MARIANNU (křty Hedviky 30. 8. 1727, DGS 5393677 sn228 P; Anny IV 1729, DGS 5387436 FS10 P – M); Susanna jako matka až od 1739/40. Pokud jde o téhož muže (Georg Kyonka † 25. 4. 1746, 56 l., *~1690), byla Susanna 2. žena (K). Křest Jiřího IX 1725 – XII 1728 není (D). Odhad nar. ~1725 nemá oporu – otec dětí 1739–44 *nejpozději ~1718.",
    "fs_old113: 19. 4. 1729 zemřela „Marianna Kijonczyno“ (DGS 5387446 sn5 L, M) – 7 dní po křtu Anny (12. 4. 1729, dcera Jiřího a Marianny) → patrně 1. žena Jiřího, † v šestinedělí (D). Žádné dítě Jiřího V 1729 – X 1731 (D). Přechod na Zuzanu tedy mezi 1729 a 1739; Kolwasové (pozdější kmotři Jiřího a Zuzany) už 1731 – slabá vazba (K).",
    "fs_old114: první známé dítě Jiřího Kijonky a Zuzany je Jakub, pokř. 2. 7. 1734, Dětmarovice („ex Patre Georgio Kijonka & matre Susanna … Jacobus. Patrini … Nicolaus Babisz & Eva Ramesska“, DGS 5387436 FS39 P, ark 3:1:3QSQ-G9MW-MRQ8; čtení M, ztotožnění D). Žádné dítě Jiřího V 1729 – VI 1734 → sňatek se Zuzanou ~1730 – X 1733 (D), v D. Lutyni nezapsán. Rodné jméno Zuzany neuvedeno.",
    "fs_old116 (K–D, nezapsáno jako jisté): kandidátní křest 23. 3. 1692, D. Lutyně: „Georgius Parentum Georgij Ky-[skvrna]nka et consortis eius Sophiae“ (DGS 5393677 sn84 L, ark 3:1:3QS7-89MW-N9L3-G; datum a jména M, příjmení D–K, ověřeno koordinátorem – za zalomením řádku skvrna). Sedí na Georga Kyonku † 1746 (56 l.) jen přibližně (54). Starší bratr Jan 22. 6. 1690 Dětmarovice (otec Georgius Kic/ienka, matka Sophia nata Kubiska(?)). Hypotéza (K): rodiče Jiří Kijonka st. × Žofie (roz. Kubiská?); bratři Pavel (∞ 1720) a Matěj (∞ 1723). Sňatek Jiřího × Marianny v D. Lutyni II 1705 – II 1753 není (D).",
    "fs_old117: rodina Jiří Kyjanka/Kijonka (st.) × Žofie, Dětmarovice – děti: Jan 22. 6. 1690, Jiří 23. 3. 1692 (příjmení Ky-anka/Ky-onka, ne -enka; kandidát na našeho Jiřího, K–D), Pavel 21. 12. 1693, Matěj 17. 2. 1696, Jakub 23. 4. 1697 (DGS 5393677 sn75, 84, 92, 101, 106; M/D). Jednu rodinu dokládají opakovaní kmotři (Adam Bernat, Simon Nity – D). Kyjanka = Kijonka (týž kmotr Jiří se stejnými spolukmotry 1692/1694, D). V obci zároveň Řehoř Kyjanka × Ester (1695). Pavel a Matěj jsou patrně ženichové 1720/1723 (K–D). Rodné jméno Žofie nejisté (Kubiska/Babiska?).",
    "fs_old118: sňatky 7. 11. 1720 „Paulus Filius Georgio Kijonka“ × Marianna Skawronek a 2. 2. 1723 „Mathias Filius Georgio Kijonka“ × Marianna Babysz (DGS 5393677 sn309 P, sn313 P; D) – otec Jiří v obou živ, bez věku → ztotožnění s Pavlem *1693 a Matějem *1696 K–D. Jiří Kijonka ml. není svědkem ani ženichem VI 1717 – XI 1725 (D). Další děti Jiří st. × Žofie V 1697 – II 1699 nejsou.",
    "fs_old119: pohřby D. Lutyně V 1746 – XII 1750 a I 1772 – VII 1773 (+ dřívější agenti zbytek knihy do 1778): jiný Jiří Kijonka/Kania věkem vhodný na muže Zuzany není; zemřel jen Jiří Kania č. 29, 39 let, 5. 7. 1771 (*~1732, muž Evy – jiná osoba, D). Pohřeb Zuzany jako vdovy nenalezen. Spolu s „post Defunctum Georgium Kijenka“ (sňatek 1757) → ztotožnění s Georgem Kyonkou † 25. 4. 1746 (56 l., *~1690, kandidát křest 1692) zůstává K–D, bez protidokladu.",
    "fs_old134: sňatek kandidátních rodičů 9. 10. 1689 (19. neděle po Letnicích), D. Lutyně: „honestum Juvenem Georgium Kyanka Wilmersdorffio cum honesta puella Sophia nata filia Andreae Kubiss Polono-Lutinio“, svědci Jan Kaneš(?), Jan Valach, Chrobaczek z Dětmarovic (DGS 5393677 sn336 L, ark 3:1:3QS7-89MW-N9L3-S; čtení M/D, ověřeno koordinátorem). Žofie = dcera Ondřeje Kubise z Polské Lutyně (D); první dítě Jan 22. 6. 1690. Ženich z Vilémovic (Wilmersdorf); snad syn Jana Kyjanka(?) × Marianny (Wilmersdorf 1674, K). Spojení s naší linií (Jiří *1692 = Jiří † 1746 = otec Mariny 1744) dál K–D – nezapsáno do stromu.",
    "fs_old135 (kmotři): bratři Kijonkové si v této faře navzájem nekmotří (ani jisté bratry Pavel a Matěj) → bratrství Jiřího s Pavlem/Matějem kmotry nedoložíme (K). Naopak kontinuita kmotrů podporuje, že Jiří × Marianna (1727, kmotra Marianna Kolwaska; Ramesz 1724–31) a Jiří × Zuzana (1734 Eva Ramesska; 1735, 1739/40, 1744 Jakub Karlik + Marianna/Marina Kolwaska) je TÝŽ muž (D). Nový křest: 6. 7. 1735 Jakub, syn Jiřího Kyonky a Zuzany (DGS 5387436 FS46 L, M) – Jakub 1734 asi zemřel.",
    "fs_old136: Fryštát O I 1714 – XI 1727 bez sňatku Jiřího Kijonky (D); vol. 2734 tím přečten celý. Sňatek Jiří × Marianna tedy ani v D. Lutyni 1705–53, ani ve Fryštátu 1708–61 – fara nevěsty (Orlová, Bohumín, Karviná, Petřvald…; na FS pro 1714–26 nedostupné).",
    "fs_old137: děti Jiří Kijonka × Zuzana (D. Lutyně, DGS 5387436): Jakub 2. 7. 1734 (FS39 P), Jakub 6. 7. 1735 (FS46 L), Jan [18.] 5. 1738 (FS61 L, M; nový), Matouš 11. 9. 1739/40 (FS76; rok spíš 1740, D), Marianna II 1743 († 21. 2. 1743), Marina 29. 6. 1744 (FS93 P). Kmotři od 1735 stále Jakub Karlik + Marina Kolwaská; Jiří sám kmotrem Karlikovy dcery 1736 (vzájemné kmotrovství, D).",

    "fs_old31: sňatek ani v VI 1717 – II 1722 (sn305–312) a slabě X 1714 – VIII 1715 (sn302) → v Dolní Lutyni X 1714 – II 1753 není (mimo vybledlá místa); patrně v jiné farnosti (nevěstiny?). Svědkyně 1722 je „Susanna Dieyonka“, ne Kijonka (D). Kijonkové: Pavel(?) syn Jiřího ∞ 1720, Matěj syn Jiřího ∞ 1723, Tomáš syn † Jana ∞ 1718, vdova po † Řehoři Kyjonkovi ∞ 1719.",
    "fs_old33: pohřeb Jiřího ani Zuzany Kijenkových není ani 25. 3. 1763 – 2. 2. 1771 (sn84–107). Jiný pár Jiří Kania × Eva (děti 1767–69).",

    "fs_old113: 1. žena Jiřího Kijonky Marianna † 19. 4. 1729 (D) → Zuzana 2. manželka, sňatek ~1730–1739 (v D. Lutyni nezapsán – fs_old29 aj.), K–D.",

    "zao_r66: křest dítěte Šimona × Markéty (Pavla) v N Fryštát XI 1765 – III 1778 není (souvisle; K–D). Kmotr 26. 10. 1766 „Joannes Stolka ex Zovada“ – patrně bratr Markéty (K).",

    "zebrz2: matriky Zebrzydowic 1661–1800 online zdarma (CAAK, Archiwum Diecezji Bielsko-Żywieckiej, PWNMPZ 1–5). Křty 1765–VI 1772 (PWNMPZ 3, s176–201) jen Seibersdorf a Marklowitz – Závada do fary nepatřila (D–M). Křest Pavla tedy ani tam; kniha Závady před 1785 dál neznámá.",
    "fs_old89: „Simon Cyron ex Zovada“ svědkem 19. 2. 1759 (sňatek vdovce Vavřince Nogy ze Závady; FS vol. 2734 sn86 L, čtení M, ztotožnění D–K).",
    "web_z2: Závada patřila před 1785 patrně k faře Godów (pruské Slezsko): vizitace 1719 „Oprócz Zawady dołączone były Łaziska“ (Maroń 1972, s. 173; AAWr II b 157) – D (ověřeno na stránce). Od 1785 lokálie Petrovice (Kneifel 1804, s. 349 – M). Křty Godów 1740–84 jen originál v AA Katowice, online nejsou.",
    "fs_old101 (Závada, josefínská kniha 1785–97, FS vol. 2790): Šimon Cyron, sedlák, Závada č. 4, s manželkou ANNOU roz. Kajurovou („Anna gebohrne Kajurin“): děti Marina *15. 2. 1790 († 3. 8. 1791) a Matěj *20. 2. 1795 († 5. 5. 1797) (čtení M, ověřeno koordinátorem; ztotožnění se Šimonem, otcem Pavla, D – sedlák ze Závady, jediný Šimon Cyron v knize). Anna Kajurová je tedy patrně 2. manželka (1. Markéta Stolková ∞ 1765, matka Pavla *~1769 – K). 5. 5. 1791 zemřel v č. 4 Matěj Kajur, podruh, 63 let – patrně tchán (K). Šimon žil ještě V 1797; úmrtí Šimona ani Anny do IX 1797 není. Křest syna Jana v Darkově 1777 („Simon Cyron & Anna“) tím dostává oporu (K→D–K).",
    "Úmrtí 23. 4. 1804, Závada č. 4: „Simon Cyron Ausdüngler [Ausgedingler] / versehen von mir Lorenz Swentek Localkaplan … 62 Wassersucht“ – výměnkář, 62 let, vodnatelnost (čtení M, ověřeno koordinátorem; ztotožnění M–D – dům č. 4 jako křty 1790/95, grunt předán synu Pavlovi ∞ 1803). Věk 62 → nar. ~1742. Vdova Anna † 22. 6. 1824 č. 4, 80 let, zaopatřena „von Godauer Pfarrer Andreas Skocoron“ (= farář z Godowa – podporuje vazbu Závady na Godów). Dcera Anna, svobodná, † 17. 10. 1834, 70 let (*~1764 – patrně z 1. manželství se Stolkovou, K).",
    "fs_old127 (K): 26. 7. 1761 Fryštát – „Adam Gyron(?) honestus Viduus ex Zawada“ ∞ Zuzana, dcera † Jana Šostka z Koukolné; svědek Ondřej Balthasar ze Závady (vol. 2734 sn92 L, ark 3:1:3QS7-89MW-J91Y; G/C D-). Možný příbuzný (otec?) Šimona Cyrona *~1742 – jen K."

    "zao_r55: křest syna Josefa 8. 3. 1789, Závada č. 10: „Joseph Dzięgiel … Johann Dzięgiel Ackerb: | Marina gebohrne Hain(in)(?) | Jakob Ciron; Marina des Georg Landeczky“ (F VIII 3, inv. 2790, sn4 L; čtení D–M, ověřeno koordinátorem). Manželka tedy Marina roz. H…ová (K) – zda je matkou Magdaleny (nar. před 1789), neověřeno. Johann žil ještě 1789; v rejstříku zemřelých 1785–1845 chybí. Magdalena v křtech Závady 1785 – IV 1791 není → nar. spíš před 1785 (kniha pro Závadu 1738–84 zatím neznámá).",

    "caak_dz2: v Zebrzydowicích 1776–1784 Jan Dzięgiel není (ani otec, ženich, kmotr; D). Tamní rod: Jakub († před 1778), Jiří (∞ 1778 Anna Eliasz), Šimon, Josef. Jan nejspíš odjinud – hledat sňatek ve fryštátské knize (petrovické sňatky) a ve faře nevěsty.",

    "zao_r82–83: sňatek s Marinou v O Fryštát (F IV 7) souvisle II 1773 – X 1788 není (D); zbývá jen XII 1770 – I 1773 (sn34–40, málo pravděpodobné). Pravděpodobně oddán ve faře nevěsty (Orlová?).",

    "fs_old108: 13. 1. 1817, Závada č. 28 se vdala „Johanna des + Johann Dziegiel gewesenen Ackerbauers Tochter“, 25 let (*~1792), za Jakuba, syna Martina Dzierżęgy (26); svědek „Joseph Dziegiel Ackerbauer von da“ – patrně syn Jana (K–D). Johanna je sestra Magdaleny (obě „dcera † Jana Dzięgiela, bývalého sedláka“, D). Jan tedy † před I 1817; v rejstříku zemřelých D 1785–1819 není (číst knihy přímo). Čtení M, ověřeno koordinátorem (FS vol. 2793 sn66 L, pag. 8; agent prohodil den a č. domu – správně den 13., č. 28).",
    "Úmrtí 9. 5. 1815, Závada č. 10: „Johann Dzigiel Auszügler … 60 Brustwassersucht“ – výměnkář, 60 let (*~1755), vodnatelnost hrudníku (čtení M, rok podle záhlaví strany D; ověřeno koordinátorem). Ztotožnění D–M: č. 10 = jeho dům (děti † 1809, 1810 „des Johann Dziegiel Ackerbauer“), 1817 „+ gewesener Ackerbauer“, sedlákem pak Josef. V rejstříku F VIII 9 chybí. Manželka Marina, rodné jméno nejisté („Jarnin/Hainin“ 1789, „H…rnin“ 1790, „Andlin“ 1793 – K). Děti v Závadě č. 10: Josef 8. 3. 1789, Johanna 24. 11. 1790 (∞ 1817, † XII 1817), dvojčata Marina a Magdalena 23./24. 3. 1793 (Marina † 14. 2. 1797), Franz ~1802 († 1810), Jan ~1807 († 1809).",
    "fs_old111: vdova Marina † 21. 8. 1844 č. 10 (~84 l.). Syn Josef, sedlák č. 10: dcera Hedvika † 19. 1. 1820 (6 l.), syn Josef † 30. 3. 1831; Josef st. snad † 14. 12. 1831 jako podruh č. 6 „Joseph Szczygiel“, 40 l. (K).",
    "fs_old122: syn Josef (*8. 3. 1789) ∞ 11. 2. 1811 Závada Eva Popiołková (*19. 12. 1789, dcera sedláka Michaela a Žofie), děti 1813–1829; sňatky dcer 1817 uvádějí otce „+ Johann Szczygiel gewesener Ackerbauer“ (M). Další děti Jana a Mariny: Franz 25. 3. 1801, Jan 5. 12. 1806.",
    "fs_old131: sňatek s Marinou Grimovou na FS nenalezen – index FS 18. stol. Fryštát nemá; rejstřík F IV 29 (D, 1784–~90) Jana Dz… nemá (D); Fryštát O X 1783 – VII 1784 bez Grim (D). Pravděpodobně Godów (do 1785, offline) nebo fara nevěsty.",

    "fs_old80: kmotr u dětí Jana Gische, Petrovice č. 23: dvojčata 20. 6. 1782 a Hedvika 7. 10. 1784 („Jacobus Kotzwara … Acker Bauer“, D). Další děti s Annou ve fryštátských křtech I 1781 – V 1785 nejsou; od VI 1785 má Petrovice vlastní matriku (hledat 1785–97). POZOR na č. d.: 20. 2. 1785 bydlí v Petrovicích č. 27 Jan Tomeček – číslice „2?“ v letech 1778/1780 může být i 21 (dům Sobotzika); vazba na dům č. 27 z 1824/31 je proto jen K. Ztotožnění syna Jana stojí hlavně na tom, že je jediným Janem s otcem Kocvarou v knize 1771–91 (D). Pozor: v Petrovicích i jiný pár Jakub × Anna (Wandrol, č. 5).",
    "Křest nedohledán: Závada před 1785 nemá dochovanou křestní knihu v ZA Opava (zao_r56–57: patřila k Orlové, ale v Ka V 3 není); rodiče ze Závady nejsou ani ve Fryštátu 1749–55 (fs_old81–82), v Karviné 1737–58 (fs_old83) ani v Zebrzydowicích 1741–53 (caak_dr13).",

<script>window.BUILD_STAMP = "21. 11. 2026 14:10";</script>
<script>
(function () {
  'use strict';
  const D = window.RODOKMEN, GEO = window.GEO || { countries: [] }, GAZ = window.GAZETTEER || {};
  const byId = new Map(D.people.map(p => [p.id, p]));
  const lineOf = new Map(D.lines.map(l => [l.id, l]));
  const CW = 180, CH = 62, GAP = 26, PXY = 9;
  const NOW = new Date().getFullYear();
  const CERT = { M: ['●', 'matrika'], D: ['◆', 'jiný doklad'], R: ['○', 'rodinná paměť'], K: ['?', 'kandidát – neověřeno'] };
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const plural = (n, one, few, many) => n === 1 ? one : n >= 2 && n <= 4 ? few : many;
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } },
  };
  // historical events: events.js (new shape {y, y2?, t, s?, major?}); fallback to legacy D.events {year|from,to, t, war}
  const EVENTS = (window.RODOKMEN_EVENTS || (D.events || []).map(e => e.from ? { y: e.from, y2: e.to, t: e.t, major: true } : { y: e.year, t: e.t }))
    .filter(e => e && e.y && e.t).slice().sort((a, b) => a.y - b.y);
  const evYears = e => e.y2 ? e.y + '–' + e.y2 : String(e.y);

  // ---------- derived relations ----------
  const children = new Map();
  for (const p of D.people) for (const r of ['father', 'mother']) if (p[r]) {
    if (!children.has(p[r])) children.set(p[r], []);
    children.get(p[r]).push(p);
  }
  function yearOf(p, depth) {
    if (p.b && p.b.year) return p.b.year;
    if ((depth || 0) > 6) return null;
    const ch = (children.get(p.id) || []).map(c => yearOf(c, (depth || 0) + 1)).filter(Boolean);
    return ch.length ? Math.min(...ch) - 28 : null;
  }
  const isApprox = p => !(p.b && p.b.year) || !!p.b.approx;
  const chain = (start, rel) => { const s = new Set(); let p = byId.get(start); while (p) { s.add(p.id); p = byId.get(p[rel]); } return s; };
  const PAT = chain(D.root, 'father'), MAT = chain(D.root, 'mother');
  // generation of each ancestor counted from the root (parents = 1); nearest path wins
  const GEN = new Map([[D.root, 0]]);
  for (const q = [D.root]; q.length;) {
    const p = byId.get(q.shift());
    for (const r of ['father', 'mother']) if (p && p[r] && byId.has(p[r]) && !GEN.has(p[r])) { GEN.set(p[r], GEN.get(p.id) + 1); q.push(p[r]); }
  }
  const genDepth = Math.max(0, ...GEN.values());
  // Tree shows the root on top and ancestors below. Descendants of the root (and partners linked
  // only through them) stay in the data and in the detail panel, but are not drawn in the tree.
  const DESC = new Set();
  (function down(id) { for (const c of children.get(id) || []) if (!DESC.has(c.id)) { DESC.add(c.id); down(c.id); } })(D.root);
  const onlyViaDesc = p => { const ch = children.get(p.id) || []; return ch.length > 0 && ch.every(c => DESC.has(c.id)) && !p.father && !p.mother; };
  const TP = D.people.filter(p => !DESC.has(p.id) && !onlyViaDesc(p));
  const lifespan = p => {
    const y = yearOf(p);
    const b = y ? (isApprox(p) ? '~' + y : y) : '?';
    const dd = p.d && p.d.year ? p.d.year : (p.alive ? '' : (p.d ? '?' : ''));
    return b + (dd || p.d ? '–' + (dd || '?') : (p.alive ? '' : '–?'));
  };
  const isDoc = p => p.cert === 'M' && p.b && p.b.year; // NAVOD 6.3: direct ancestor with cert M, estimated year allowed (~)
const yr = b => (b.approx ? '~' : '') + b.year;
  const oldestOf = list => list.filter(p => isDoc(p) && GEN.has(p.id)).reduce((a, p) => !a || p.b.year < a.b.year ? p : a, null);
  const placeShort = e => String((e && e.place) || '').replace(/\s*\(\?\)\s*/g, '').split(',')[0].trim();
  const rootP = byId.get(D.root);
  const firstName = rootP ? rootP.name.split(' ')[0] : '';
  const parseDate = s => { const m = String(s || '').match(/(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})/); return m ? new Date(+m[3], +m[2] - 1, +m[1]) : null; };
  function age(p) {
    if (!p.b || !p.b.year || p.b.approx) return null;
    if (!p.d && !p.alive) return null;
    if (p.d && (!p.d.year || p.d.approx || p.d.before)) return null;
    const b = parseDate(p.b.date), e = p.d ? parseDate(p.d.date) : new Date();
    if (b && e) { let a = e.getFullYear() - b.getFullYear(); if (e.getMonth() < b.getMonth() || (e.getMonth() === b.getMonth() && e.getDate() < b.getDate())) a--; return String(a); }
    const ey = p.d ? p.d.year : NOW;
    return ey - p.b.year >= 0 ? 'asi ' + (ey - p.b.year) : null;
  }
  const linkify = t => esc(t).replace(/https?:\/\/[^\s<>"]+/g, u => { const m = u.match(/[.,;:)\]]+$/), tail = m ? m[0] : '', url = tail ? u.slice(0, -tail.length) : u; return `<a href="${url}" target="_blank" rel="noopener">${url}</a>${tail}`; });

  // ---------- header ----------
  let active = null;
  function renderStats() {
    const n = D.people.length;
    const m = D.people.filter(p => p.cert === 'M').length;
    const doc = oldestOf(D.people);
    const stamp = window.BUILD_STAMP && window.BUILD_STAMP.indexOf('@') < 0 ? window.BUILD_STAMP : '';
    $('#stats').innerHTML = `<b>${n}</b> ${plural(n, 'osoba', 'osoby', 'osob')} · <b>${genDepth}</b> ${plural(genDepth, 'generace', 'generace', 'generací')} zpět` +
      ` <span title="Počítáno od ${esc(firstName)}: rodiče = 1. generace, prarodiče = 2. …">(rodiče = 1.)</span> · <b>${m}</b> doloženo matrikou · nejstarší doložený předek: ` +
      (doc ? `<button type="button" class="plink" data-go="${esc(doc.id)}">${esc(doc.name)}</button> (${yr(doc.b)})` : '<span class="unk">zatím žádný (jen rodinná paměť)</span>') +
      (stamp ? ` · aktualizace ${esc(stamp)}` : '');
    $('#chips').innerHTML = D.lines.map(l => {
      const c = D.people.filter(p => p.line === l.id).length;
      return `<button type="button" class="chip" aria-pressed="false" data-line="${esc(l.id)}"><span class="sw" style="background:${esc(l.color)}"></span>${esc(l.name)} <span class="n">${c}</span></button>`;
    }).join('');
    $('#keys').innerHTML = `<span><i style="background:var(--pat)"></i>přímá otcovská linie</span><span><i style="background:var(--mat)"></i>přímá mateřská linie</span>` +
      Object.entries(CERT).map(([k, v]) => `<span>${v[0]} ${v[1]}</span>`).join('');
    $('#home').textContent = '⌂ ' + firstName;
  }
  function applyFilter() {
    document.querySelectorAll('#world .card').forEach(c => c.classList.toggle('dim', !!active && c.dataset.line !== active));
    document.querySelectorAll('#chips .chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.line === active)));
  }
  $('#chips').addEventListener('click', e => {
    const b = e.target.closest('.chip');
    if (!b) return;
    active = active === b.dataset.line ? null : b.dataset.line;
    applyFilter();
  });
  $('#stats').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) goTo(b.dataset.go); });

  // ---------- tree layout ----------
  const X = new Map(), Y = new Map();
  let world = { w: 0, h: 0 };
  function layout() {
    let slot = 0;
    const visit = id => {
      const p = byId.get(id);
      if (!p || X.has(id)) return;
      const par = [p.father, p.mother].filter(i => byId.has(i));
      par.forEach(visit);
      if (!par.length) X.set(id, slot++ * (CW + GAP));
      else X.set(id, par.reduce((s, i) => s + X.get(i), 0) / par.length);
    };
    visit(D.root);
    // everybody else: next to a placed relative, otherwise in a new slot
    let guard = 0, todo = TP.filter(p => !X.has(p.id));
    while (todo.length && guard++ < 50) {
      for (const p of todo) {
        const rel = [p.father, p.mother].filter(i => X.has(i)).concat((children.get(p.id) || []).map(c => c.id).filter(i => X.has(i)));
        if (rel.length) X.set(p.id, X.get(rel[0]) + (CW + GAP) * 0.6);
      }
      const left = TP.filter(p => !X.has(p.id));
      if (left.length === todo.length) { X.set(left[0].id, slot++ * (CW + GAP)); }
      todo = TP.filter(p => !X.has(p.id));
    }
    const ys = TP.map(p => yearOf(p)).filter(Boolean);
    let y0 = Math.floor((Math.min(...ys) - 6) / 10) * 10;
    // extend the time axis a little so that early events (e.g. the Thirty Years' War) and today fit in
    const evMin = EVENTS.length ? EVENTS[0].y : y0;
    if (evMin < y0 && y0 - evMin <= 60) y0 = Math.floor(evMin / 10) * 10;
    const y1 = Math.max(Math.max(...ys) + 8, NOW + 1);
    // inverted axis: youngest (root) on top, oldest ancestors at the bottom
    for (const p of TP) Y.set(p.id, (y1 - (yearOf(p) || y0)) * PXY);
    // resolve overlaps: push later cards right
    const ids = TP.map(p => p.id).sort((a, b) => Y.get(a) - Y.get(b) || X.get(a) - X.get(b));
    for (let i = 0; i < ids.length; i++) for (let j = 0; j < i; j++) {
      const a = ids[j], b = ids[i];
      if (Math.abs(X.get(a) - X.get(b)) < CW + 8 && Math.abs(Y.get(a) - Y.get(b)) < CH + 6) { X.set(b, X.get(a) + CW + 12); j = -1; }
    }
    const minX = Math.min(...X.values());
    for (const [k, v] of X) X.set(k, v - minX + 20);
    const treeW = Math.max(...X.values()) + CW;
    world = { w: treeW + 40, h: (y1 - y0) * PXY + CH + 40, y0, y1, treeW };
  }

  function renderTree() {
    const w = $('#world');
    let svg = `<svg width="${world.w}" height="${world.h}" aria-hidden="true">`;
    // wars (major bands) as a faint background across the tree
    for (const e of EVENTS) if (e.y2 && e.major && e.y2 >= world.y0 && e.y <= world.y1) {
      const ya = (world.y1 - e.y2) * PXY, yb = (world.y1 - e.y) * PXY;
      svg += `<rect x="0" y="${ya}" width="${world.w}" height="${yb - ya}" fill="var(--war)"/>`;
    }
    // decade grid (dashed, so it never looks like a family link); labels are in the pinned ruler
    svg += '<g class="scale">';
    for (let y = Math.ceil(world.y0 / 10) * 10; y <= world.y1; y += 10) {
      const py = (world.y1 - y) * PXY;
      svg += `<line x1="0" x2="${world.w}" y1="${py}" y2="${py}" stroke="var(--grid)"${y % 100 ? ' stroke-dasharray="6 6"' : ''}/>`;
    }
    svg += '</g><g fill="none" stroke-width="2">';
    for (const c of TP) for (const r of ['father', 'mother']) {
      const p = byId.get(c[r]);
      if (!p || !Y.has(p.id)) continue;
      // child above, parent below: from the child's bottom edge to the parent's top edge
      const x1 = X.get(c.id) + CW / 2, y1 = Y.get(c.id) + CH, x2 = X.get(p.id) + CW / 2, y2 = Y.get(p.id);
      const col = PAT.has(p.id) && PAT.has(c.id) ? 'var(--pat)' : MAT.has(p.id) && MAT.has(c.id) ? 'var(--mat)' : 'var(--edge)';
      const my = (y1 + y2) / 2;
      svg += `<path d="M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}" stroke="${col}"${isApprox(p) || isApprox(c) ? ' stroke-dasharray="5 4"' : ''}/>`;
    }
    svg += '</g></svg>';
    let html = svg;
    for (const p of TP) {
      const l = lineOf.get(p.line) || { color: '#888' };
      const cls = ['card', p.id === D.root ? 'root' : PAT.has(p.id) ? 'pat' : MAT.has(p.id) ? 'mat' : ''].join(' ');
      const cert = CERT[p.cert] || ['', ''];
      html += `<div class="${cls}" data-id="${esc(p.id)}" data-line="${esc(p.line)}" style="left:${X.get(p.id)}px;top:${Y.get(p.id)}px;--lc:${esc(l.color)}" title="${esc(p.name)}">` +
        `<span class="cert" title="${esc(cert[1])}">${cert[0]}</span>` +
        `<div class="n">${esc(p.name)}</div>` +
        `<div class="m">${p.maiden ? 'roz. ' + esc(p.maiden) + ' · ' : ''}${esc(lifespan(p))}</div></div>`;
    }
    w.innerHTML = html;
    w.style.width = world.w + 'px';
    w.style.height = world.h + 'px';
  }

  // ---------- year ruler + events column (screen space, follows pan & zoom) ----------
  const axis = $('#axis'), rulerEl = $('#ruler'), eventsEl = $('#events');
  let TICKS = [], EVL = [];
  function buildAxis() {
    let r = '';
    for (let y = Math.ceil(world.y0 / 10) * 10; y <= world.y1; y += 10) r += `<div class="tick${y % 100 === 0 ? ' century' : ''}" data-y="${y}">${y}</div>`;
    rulerEl.innerHTML = r;
    TICKS = [...rulerEl.querySelectorAll('.tick')].map(el => ({ y: +el.dataset.y, el }));
    const list = EVENTS.filter(e => (e.y2 || e.y) >= world.y0 && e.y <= world.y1);
    let h = '';
    list.forEach((e, i) => {
      const title = esc(evYears(e) + ': ' + e.t);
      h += `<div class="${e.y2 ? 'evband' : 'evdot'}${e.major ? ' major' : ''}" data-i="${i}" title="${title}"></div>` +
        `<div class="evl${e.major ? ' major' : ''}" data-i="${i}" title="${title}"><span class="l"><b>${esc(evYears(e))}</b>${esc(e.t)}</span>` +
        `<span class="s"><b>${esc(evYears(e))}</b>${esc(e.s || e.t)}</span></div>`;
    });
    eventsEl.innerHTML = h;
    const marks = eventsEl.querySelectorAll('.evdot,.evband'), labels = eventsEl.querySelectorAll('.evl');
    // labels are anchored at the year (bands: their middle) and laid out top-down: newest first
    EVL = list.map((e, i) => ({ e, mark: marks[i], label: labels[i], h: 0, anchor: e.y2 ? (e.y + e.y2) / 2 : e.y }))
      .sort((a, b) => b.anchor - a.anchor);
  }
  function layoutAxis() {
    if (!TICKS.length) return;
    const s = Z.s, H = axis.clientHeight;
    const yy = y => Z.ty + (world.y1 - y) * PXY * s;
    const dec = PXY * 10 * s, step = dec >= 16 ? 10 : dec * 5 >= 16 ? 50 : 100;
    for (const t of TICKS) {
      const top = yy(t.y);
      t.el.style.top = top + 'px';
      t.el.hidden = t.y % step !== 0 || top < -12 || top > H + 12;
    }
    if (eventsEl.offsetParent === null) return;   // column hidden
    // labels: major events first, each as close to its year as possible (at most TOL px away), otherwise hidden;
    // the dot/band always stays at the exact year and keeps the full text as a tooltip
    const TOL = 36, placed = [];
    const free = (t, h) => placed.every(q => t + h + 2 <= q[0] || t >= q[1] + 2);
    for (const o of EVL) {
      if (o.e.y2) { const a = yy(o.e.y2), b = yy(o.e.y); o.mark.style.top = a + 'px'; o.mark.style.height = Math.max(2, b - a) + 'px'; }
      else o.mark.style.top = yy(o.e.y) + 'px';
    }
    for (const o of EVL.slice().sort((a, b) => (b.e.major ? 1 : 0) - (a.e.major ? 1 : 0) || b.anchor - a.anchor)) {
      const want = yy(o.anchor);
      if (want < -40 || want > H + 40) { o.label.hidden = true; continue; }
      o.label.hidden = false;
      if (!o.h) o.h = o.label.offsetHeight || 16;
      const h = o.h, w0 = want - h / 2;
      const cands = [w0, ...placed.map(q => q[1] + 3), ...placed.map(q => q[0] - h - 3)]
        .filter(t => Math.abs(t - w0) <= TOL + h / 2 && free(t, h)).sort((a, b) => Math.abs(a - w0) - Math.abs(b - w0));
      if (!cands.length) { o.label.hidden = true; continue; }
      o.label.style.top = cands[0] + 'px';
      placed.push([cands[0], cands[0] + h]);
    }
  }
  const remeasure = () => { for (const o of EVL) o.h = 0; };
  eventsEl.addEventListener('click', e => {
    if (moved) return;
    const l = e.target.closest('.evl');
    if (!l) return;
    l.classList.toggle('full');   // on narrow screens: tap shows the full text
    remeasure(); layoutAxis();
  });
  function setEvents(on) {
    $('#treeview').classList.toggle('noev', !on);
    $('#zev').setAttribute('aria-pressed', String(on));
    store.set('rodokmen.events', on ? '1' : '0');
    remeasure(); apply();
  }
  $('#zev').onclick = () => setEvents($('#treeview').classList.contains('noev'));

  // ---------- pan & zoom ----------
  const vp = $('#vp'), wEl = $('#world');
  const Z = { s: 1, tx: 0, ty: 0, min: 0.1, max: 3 };
  function clamp() {
    const W = vp.clientWidth, H = vp.clientHeight, m = 40;
    const ax = m, bx = W - world.w * Z.s - m, ay = m, by = H - world.h * Z.s - m;
    Z.tx = Math.min(Math.max(Z.tx, Math.min(ax, bx)), Math.max(ax, bx));
    Z.ty = Math.min(Math.max(Z.ty, Math.min(ay, by)), Math.max(ay, by));
  }
  function apply() {
    clamp();
    wEl.style.transform = `translate(${Z.tx}px,${Z.ty}px) scale(${Z.s})`;
    $('#zrange').value = Math.round(Z.s * 100);
    $('#zpct').textContent = Math.round(Z.s * 100) + ' %';
    layoutAxis();
  }
  function zoomAt(s, cx, cy) {
    s = Math.min(Z.max, Math.max(Z.min, s));
    const wx = (cx - Z.tx) / Z.s, wy = (cy - Z.ty) / Z.s;
    Z.s = s; Z.tx = cx - wx * s; Z.ty = cy - wy * s;
    apply();
    store.set('rodokmen.scale', String(Z.s));
  }
  const center = () => [vp.clientWidth / 2, vp.clientHeight / 2];
  function fit() {
    const W = vp.clientWidth, H = vp.clientHeight;
    Z.s = Math.min(Z.max, Math.max(Z.min, Math.min((W - 40) / world.w, (H - 90) / world.h, 1.2)));
    Z.tx = (W - world.w * Z.s) / 2; Z.ty = (H - 60 - world.h * Z.s) / 2;
    apply();
    store.set('rodokmen.scale', String(Z.s));
  }
  function focus(id) {
    if (!X.has(id)) return;   // descendants of the root are not drawn in the tree
    const W = vp.clientWidth, H = vp.clientHeight;
    Z.tx = W / 2 - (X.get(id) + CW / 2) * Z.s;
    Z.ty = H / 2 - (Y.get(id) + CH / 2) * Z.s;
    apply();
  }
  // wheel, Safari gestures, drag and touch pinch work on the tree and on the pinned axis alike
  const ptrs = new Map();
  let drag = null, pinch = null, moved = false;
  function bindPan(el) {
    el.addEventListener('wheel', e => {
      e.preventDefault();
      const r = vp.getBoundingClientRect();
      if (e.ctrlKey || e.metaKey) zoomAt(Z.s * Math.exp(-e.deltaY * 0.01), e.clientX - r.left, e.clientY - r.top);
      else { Z.tx -= e.deltaX; Z.ty -= e.deltaY; apply(); }
    }, { passive: false });
    let gs = 1;
    el.addEventListener('gesturestart', e => { e.preventDefault(); gs = Z.s; }, { passive: false });
    el.addEventListener('gesturechange', e => {
      e.preventDefault();
      const r = vp.getBoundingClientRect();
      zoomAt(gs * e.scale, (e.clientX || r.width / 2 + r.left) - r.left, (e.clientY || r.height / 2 + r.top) - r.top);
    }, { passive: false });
    el.addEventListener('gestureend', e => e.preventDefault(), { passive: false });
    el.addEventListener('pointerdown', e => {
      ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
      moved = false;
      if (ptrs.size === 1) drag = { x: e.clientX, y: e.clientY, tx: Z.tx, ty: Z.ty };
      if (ptrs.size === 2) {
        const [a, b] = [...ptrs.values()];

        zoomAt(pinch.s * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);

  // ---------- detail ----------
  function link(p) { return p ? `<a class="p" data-id="${esc(p.id)}">${esc(p.name)}</a> <span class="unk">${esc(lifespan(p))}</span>` : ''; }
  function partners(p) {
    const s = new Set();
    for (const c of children.get(p.id) || []) for (const r of ['father', 'mother']) if (c[r] && c[r] !== p.id) s.add(c[r]);
    return [...s].map(i => byId.get(i)).filter(Boolean);
  }
  // siblings: people sharing a parent (half-siblings marked) plus recorded siblings outside the tree
  function siblingsOf(p) {
    const s = new Map();
    for (const q of D.people) {
      if (q.id === p.id) continue;
      const sameF = p.father && q.father === p.father, sameM = p.mother && q.mother === p.mother;
      const half = !(sameF && sameM) && p.father && p.mother && q.father && q.mother;
      if (sameF || sameM) s.set(q.id, half ? ' (nevlastní)' : '');
    }
    for (const x of p.siblings || []) if (byId.has(x)) s.set(x, s.get(x) || '');
    return { known: [...s].map(([i, h]) => ({ p: byId.get(i), h })), text: (p.siblings || []).filter(x => !byId.has(x)) };
  }

    if (!e) return kind === 'd' ? (p.alive ? 'žije' : '<span class="unk">neznámé – zatím nedohledáno</span>') : '<span class="unk">neznámé – zatím nedohledáno</span>';
    const when = e.date || (e.year ? (e.approx ? 'kolem ' + e.year + ' (odhad)' : e.year) : '');
    const t = [when, e.place].filter(Boolean).map(esc).join(', ');

  function lifeEvents(p) {

  // ---------- wider family circle: every ancestral couple with all their known children ----------
  function renderWide() {
    const sel = $('#wLine'), only = $('#wOnly');
    if (!sel.dataset.ready) {
      sel.insertAdjacentHTML('beforeend', D.lines.map(l => `<option value="${esc(l.id)}">${esc(l.name)}</option>`).join(''));
      sel.onchange = renderWide; only.onchange = renderWide; sel.dataset.ready = '1';

    const nm = id => byId.has(id) ? `<a class="p" data-id="${esc(id)}">${esc(byId.get(id).name)}</a>` : '<span class="unk">?</span>';
    const dates = id => byId.has(id) ? ` <span class="tag">${esc(lifespan(byId.get(id)))}</span>` : '';
    const groups = new Map();
    let nFam = 0, nSib = 0;
    const add = (g, html) => { if (!groups.has(g)) groups.set(g, []); groups.get(g).push(html); };
    // the root's own family (partners and children), if recorded
    const rk = (children.get(D.root) || []).slice().sort((a, b) => (yearOf(a) || 0) - (yearOf(b) || 0));
    if (rk.length && (!line || rootP.line === line)) {
      const pr = partners(rootP);
      add(0, `<div class="fam" style="--c:${esc((lineOf.get(rootP.line) || {}).color || '')}"><div class="fh">${nm(D.root)}${pr.length ? ' × ' + pr.map(q => nm(q.id)).join(', ') : ''}</div>` +
        `<ul>${rk.map(c => `<li>${nm(c.id)}${dates(c.id)}</li>`).join('')}</ul></div>`);
    }
    for (const [xid, g] of GEN) {
      const x = byId.get(xid), F = x.father, M = x.mother;

      const lp = byId.get(F) || byId.get(M);
      if (line && lp.line !== line) continue;
      const sibs = D.people.filter(q => q.id !== x.id && ((F && q.father === F) || (M && q.mother === M)))
        .sort((a, b) => (yearOf(a) || 0) - (yearOf(b) || 0));
      const half = q => (F && M && q.father && q.mother && !(q.father === F && q.mother === M)) ? '<span class="tag">nevlastní</span>' : '';
      const strSibs = (x.siblings || []).filter(s => !byId.has(s));
      const cnt = sibs.length + strSibs.length;
      if (onlySib && !cnt) continue;
      nFam++; nSib += cnt;
      const mar = (byId.get(F) || {}).marriage || (byId.get(M) || {}).marriage || '';
      const items = [`<li class="direct">${nm(x.id)}${dates(x.id)}<span class="tag">přímá linie</span></li>`,
        ...sibs.map(q => `<li>${nm(q.id)}${dates(q.id)}${half(q)}</li>`), ...strSibs.map(t => `<li>${esc(t)}</li>`)];
      add(g + 1, `<div class="fam" style="--c:${esc((lineOf.get(lp.line) || {}).color || '')}"><div class="fh">${nm(F)} × ${nm(M)}</div>` +
        `${mar ? `<div class="fm">sňatek ${esc(mar)}</div>` : ''}<ul>${items.join('')}</ul>${cnt ? '' : '<div class="none">Sourozenci zatím nejsou známi.</div>'}</div>`);

    $('#wideIntro').textContent = `Každá karta je jedna rodina předků: rodiče a všechny jejich známé děti – přímý předek je tučně, ostatní jsou jeho sourozenci. ` +
      `${nFam} ${plural(nFam, 'rodina', 'rodiny', 'rodin')}, ${nSib} ${plural(nSib, 'známý sourozenec', 'známí sourozenci', 'známých sourozenců')} předků. Generace se počítají od kořene stromu${rootP ? ' (' + rootP.name + ')' : ''}: rodiče = 1.`;
    $('#wideBody').innerHTML = [...groups.keys()].sort((a, b) => a - b).map(g => `<h3>${head(g)}</h3>${groups.get(g).join('')}`).join('') || '<p class="none">Nic neodpovídá filtru.</p>';
  }
  $('#wideview').addEventListener('click', e => { const a = e.target.closest('a.p'); if (a) goTo(a.dataset.id); });

  // ---------- map tab ----------
  const placeKey = s => String(s || '').replace(/\s*\(\?\)\s*/g, '').split(',')[0].trim();
  const map = $('#map');
  const MZ = { base: null, vb: null };
  function setVB() {
    const b = MZ.base, v = MZ.vb;
    v.w = Math.min(b.w, Math.max(b.w / 8, v.w)); v.h = v.w * b.h / b.w;
    v.x = Math.min(b.x + b.w - v.w, Math.max(b.x, v.x)); v.y = Math.min(b.y + b.h - v.h, Math.max(b.y, v.y));
    map.setAttribute('viewBox', `${v.x} ${v.y} ${v.w} ${v.h}`);
    map.style.setProperty('--k', (v.w / b.w).toFixed(3));

  // simple de-overlap of place labels in screen-proportional units (k = current zoom factor)
  function placeMapLabels(k) {
    const placed = [];
    for (const t of map.querySelectorAll('text.plab')) {
      const x = +t.dataset.x, y = +t.dataset.y;
      let ly = y + 4 * k;
      while (placed.some(q => Math.abs(q.y - ly) < 14 * k && Math.abs(q.x - x) < 120 * k)) ly += 14 * k;
      placed.push({ x, y: ly });
      t.setAttribute('x', x + 9 * k); t.setAttribute('y', ly);

  function mapZoom(f, cx, cy) {

    const fx = (cx - r.left) / r.width, fy = (cy - r.top) / r.height, ux = v.x + fx * v.w, uy = v.y + fy * v.h;
    v.w = Math.min(MZ.base.w, Math.max(MZ.base.w / 8, v.w / f)); v.h = v.w * MZ.base.h / MZ.base.w;

  }

  map.addEventListener('dblclick', e => { e.preventDefault(); mapZoom(e.shiftKey ? 0.5 : 2, e.clientX, e.clientY); });

  function renderMap() {
    const used = new Map();
    for (const p of D.people) for (const e of [p.b, p.d]) {
      if (!e || !e.place) continue;
      const k = placeKey(e.place);
      if (!GAZ[k]) continue;
      const y = e.year || null;
      if (!used.has(k) || (y && (!used.get(k) || y < used.get(k)))) used.set(k, y);
    }
    for (const m of D.moves || []) for (const k of [m.from, m.to]) if (GAZ[k] && !used.has(k)) used.set(k, m.year || null);
    const pts = [...used.keys()].map(k => GAZ[k]);
    let lon0 = 18.5, lat0 = 49.8;
    if (pts.length) { lon0 = pts.reduce((s, p) => s + p.lon, 0) / pts.length; lat0 = pts.reduce((s, p) => s + p.lat, 0) / pts.length; }
    let dLon = 3.4, dLat = 2.0;
    for (const p of pts) { dLon = Math.max(dLon, Math.abs(p.lon - lon0) * 1.3); dLat = Math.max(dLat, Math.abs(p.lat - lat0) * 1.3); }
    const k = Math.cos(lat0 * Math.PI / 180), W = 800;
    const H = Math.round(W * dLat / (dLon * k));
    const px = lon => (lon - (lon0 - dLon)) / (2 * dLon) * W, py = lat => ((lat0 + dLat) - lat) / (2 * dLat) * H;
    let s = '';
    for (const c of GEO.countries) {
      const d = c.rings.map(r => 'M' + r.map(([x, y]) => px(x).toFixed(1) + ',' + py(y).toFixed(1)).join('L') + 'Z').join('');
      s += `<path class="land${c.id === 'CZE' ? ' cz' : ''}" d="${d}"></path>`;
    }
    const names = { CZE: [15.5, 49.8, 'Česko'], POL: [19.4, 51.0, 'Polsko'], SVK: [19.4, 48.75, 'Slovensko'],
      AUT: [14.5, 47.6, 'Rakousko'], DEU: [11.5, 50.9, 'Německo'], HUN: [19.5, 47.2, 'Maďarsko'] };
    for (const [id, [x, y, label]] of Object.entries(names)) {
      const c = GEO.countries.find(q => q.id === id);
      if (c && px(x) > 20 && px(x) < W - 20 && py(y) > 12 && py(y) < H - 12) s += `<text class="cname" x="${px(x)}" y="${py(y)}">${esc(label)}</text>`;
    }
    for (const m of D.moves || []) {
      const a = GAZ[m.from], b = GAZ[m.to];
      if (!a || !b) continue;
      const dash = m.kind === 'rail' ? ' stroke-dasharray="8 5"' : m.kind === 'hyp' ? ' stroke-dasharray="2 4"' : '';
      s += `<line x1="${px(a.lon)}" y1="${py(a.lat)}" x2="${px(b.lon)}" y2="${py(b.lat)}" stroke="var(--accent)" stroke-width="2"${dash}><title>${esc(m.t || '')}</title></line>`;
    }
    for (const [name, y] of [...used].sort((a, b) => GAZ[b[0]].lat - GAZ[a[0]].lat)) {
      const g = GAZ[name], x = px(g.lon), yy = py(g.lat);
      s += `<circle class="pt" cx="${x}" cy="${yy}" r="5"><title>${esc(name)}</title></circle>` +
        `<text class="plab" data-x="${x}" data-y="${yy}" x="${x + 9}" y="${yy + 4}">${esc(name)}${y ? ' (' + y + ')' : ''}</text>`;
    }
    map.innerHTML = s;
    MZ.base = { x: 0, y: 0, w: W, h: H }; MZ.vb = { ...MZ.base };

    const pts = new T.Points(pg, ptsMat); pts.frustumCulled = false; scene.add(pts);

    // faint disc under the root
    const disc = new T.Mesh(new T.CircleGeometry(3.2, 64), new T.MeshBasicMaterial({ color: 0x3a2c10, transparent: true, opacity: 0.35, blending: T.AdditiveBlending, depthWrite: false }));
    disc.rotation.x = -Math.PI / 2; disc.position.y = -0.03; scene.add(disc);

    composer = new three.EffectComposer(renderer);
    composer.addPass(new three.RenderPass(scene, camera));
    bloom = new three.UnrealBloomPass(new T.Vector2(256, 256), 0.7, 0.5, 0.25);
    composer.addPass(bloom);
    composer.addPass(new three.OutputPass());

    // 3D name labels: root + two nearest generations
    for (const h of hot) {
      if (h.g > 2) continue;
      const p = byId.get(h.id), el = document.createElement('div');
      el.className = 'an-lbl' + (h.n === 1 ? ' root' : '');
      el.textContent = h.n === 1 ? p.name : p.name.replace(/\s*\(.*?\)\s*/g, ' ').trim() + (p.b && p.b.year ? ' · ' + yrTxt(p.b) : '');
      labelsBox.appendChild(el); labels.push({ el, h });
    }
    const rootH = hot.find(h => h.n === 1);
    if (rootH && !labels.some(l => l.h.n === 1)) { /* root always included above */ }
    bindInput();
    resize();
    new ResizeObserver(resize).observe(host);
  }

  function resize() {
    if (!renderer) return;
    const w = Math.max(1, host.clientWidth), h = Math.max(1, host.clientHeight), pr = renderer.getPixelRatio();
    renderer.setSize(w, h, false); composer.setPixelRatio(pr); composer.setSize(w, h); bloom.resolution.set(w * quality.bloom, h * quality.bloom);
    camera.aspect = w / h; camera.updateProjectionMatrix();
    ptsMat.uniforms.uScale.value = h * pr / 2 / Math.tan(camera.fov * Math.PI / 360);
    lineMat.uniforms.uGain.value = Math.min(1, Math.max(0.35, Math.pow(Math.min(w, h * 1.4) / 1150, 1.1)));
  }

  // ---------- camera choreography ----------
  function goal() {
    const f = Math.min(G, Math.max(1.4, prog));
    const top = genYf(f), r = Rf(f);
    const tan = Math.tan(camera.fov * Math.PI / 360), asp = camera.aspect;
    // the HUD covers the top ~30 %: put the growing ring ~35 % from the top, the root ~85 %
    const dist = Math.max((top + 1.5) / tan * 1.05, r / (tan * asp * 0.85)) + r * 0.5 + 2;
    const t = Math.min(1, prog / G);
    return { th: autoClock * 0.06, ph: 1.62 - 0.25 * t, d: Math.max(7, dist), ty: top * 0.66 };
  }
  function updateCamera(dt) {
    const g = goal(), idle = clock - user.last > 2.5;
    if (idle && !reduce) autoClock += dt;
    const k = Math.min(1, dt * (idle ? 1.6 : 0));
    cam.th += (g.th - cam.th) * k; cam.ph += (g.ph - cam.ph) * k; cam.d += (g.d - cam.d) * k; cam.ty += (g.ty - cam.ty) * k;
    const th = cam.th + user.th, ph = Math.min(2.6, Math.max(0.25, cam.ph + user.ph)), d = cam.d * user.zoom;
    camera.position.set(d * Math.sin(ph) * Math.sin(th), cam.ty + d * Math.cos(ph), d * Math.sin(ph) * Math.cos(th));
    camera.lookAt(0, cam.ty, 0);
    camera.updateMatrixWorld();
    return d;
  }

  // ---------- HUD ----------
  function updateHud(dt) {
    const g = Math.max(0, Math.min(G, Math.floor(prog + 1e-6)));
    if (g !== shownG) {
      shownG = g;
      numFrom = numTo + (numFrom - numTo) * (1 - numT); numTo = 2 ** g; numT = 0;
      const s = gen[g];
      if (g === 0) hudKick.textContent = `${fem ? 'Narozena' : 'Narozen'} ${yrTxt(root.b) || rootYear}`;
      else hudKick.textContent = `${genName(g)} · ` + (s.minY <= s.maxY ? (s.minY === s.maxY ? `narozeni ${s.minY}` : `narozeni ${s.minY}–${s.maxY}`) : `narozeni kolem ${Math.round(s.y / 10) * 10}`);
      hudKnown.textContent = g === 0 ? '' : s.k ? `jménem doloženo ${fmt(s.k)} z ${fmt(s.slots)}` : 'tady už jména nikdo nezapsal – nebo se nedochovala';
      rulerRows.forEach((r, i) => { r.classList.toggle('lit', i + 1 < g); r.classList.toggle('cur', i + 1 === g); });
    }
    numT = Math.min(1, numT + dt / 0.6);
    const e = 1 - Math.pow(1 - numT, 3);
    const nt = fmt(numFrom + (numTo - numFrom) * e);
    if (nt !== numTxt) { numTxt = nt; hudNum.textContent = nt; }
    const done = prog >= END - 0.01;
    if (done && !sumClosed && sum.hidden) sum.hidden = false;
    const bt = paused ? 'Přehrát' : 'Pauza';
    if (btnPause.textContent !== bt) btnPause.textContent = bt;
  }
  function updateLabels(dist) {
    const w = host.clientWidth, h = host.clientHeight, v = new three.T.Vector3();
    const narrowSum = w < 640 && !sum.hidden;
    for (const { el, h: k } of labels) {
      v.set(k.P[0], k.P[1], k.P[2]).project(camera);
      const vis = prog >= k.g + 0.15 && v.z < 1 && (k.n === 1 ? !narrowSum : dist < 34);
      const o = vis ? '1' : '0';
      if (el.style.opacity !== o) el.style.opacity = o;
      if (!vis) continue;
      el.style.left = ((v.x + 1) / 2 * w).toFixed(1) + 'px';
      el.style.top = ((1 - v.y) / 2 * h).toFixed(1) + 'px';
    }
  }

  // ---------- input ----------
  let drag = null, pinch = null, hoverH = null;
  const pointers = new Map();
  function pick(x, y) {
    const w = host.clientWidth, h = host.clientHeight, v = new three.T.Vector3();
    let best = null, bd = 18 * 18;
    for (const k of hot) {
      if (prog < k.g) continue;
      v.set(k.P[0], k.P[1], k.P[2]).project(camera);
      if (v.z > 1) continue;
      const dx = (v.x + 1) / 2 * w - x, dy = (1 - v.y) / 2 * h - y, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = k; }
    }
    return best;
  }
  function showTip(k, x, y) {
    if (!k) { tip.hidden = true; return; }
    const p = byId.get(k.id), dt = e => e ? [e.date || yrTxt(e), e.place].filter(Boolean).join(', ') : '';
    tip.innerHTML = `<b>${esc(p.name)}</b>` + (p.maiden ? `<br>roz. ${esc(p.maiden)}` : '') +
      (dt(p.b) ? `<br>* ${esc(dt(p.b))}` : '') + (p.d && dt(p.d) ? `<br>† ${esc(dt(p.d))}` : '') +
      `<em>kliknutím otevřete v rodokmenu</em>`;
    tip.hidden = false;
    const w = host.clientWidth, tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = Math.min(w - tw - 8, x + 14) + 'px';
    tip.style.top = Math.max(8, y - th - 10) + 'px';
  }
  function bindInput() {
    const cv = renderer.domElement;
    const local = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    cv.addEventListener('pointerdown', e => {
      cv.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, local(e));
      if (pointers.size === 1) drag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY };
      if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), z: user.zoom }; drag = null; }
    });
    cv.addEventListener('pointermove', e => {
      const [x, y] = local(e);
      if (pointers.has(e.pointerId)) pointers.set(e.pointerId, [x, y]);
      if (pinch && pointers.size === 2) {
        const [a, b] = [...pointers.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
        user.zoom = Math.min(4, Math.max(0.25, pinch.z * pinch.d / Math.max(10, d))); user.last = clock; return;
      }
      if (drag) {
        const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
        if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 5) { cv.classList.add('drag'); tip.hidden = true; }
        user.th -= dx * 0.006; user.ph -= dy * 0.005; drag.x = e.clientX; drag.y = e.clientY; user.last = clock;
        if (!running) frame(performance.now());
        return;
      }
      if (e.pointerType === 'mouse') {
        hoverH = pick(x, y); showTip(hoverH, x, y); cv.classList.toggle('hot', !!hoverH); if (hoverH) user.last = clock;
      }
    });
    const end = e => {
      const wasClick = drag && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 6 && pointers.size === 1;
      pointers.delete(e.pointerId);
      if (pointers.size < 2) pinch = null;
      cv.classList.remove('drag');
      if (wasClick && e.type === 'pointerup') {
        const [x, y] = local(e), k = pick(x, y);
        if (k && window.RV_focus) { tip.hidden = true; window.RV_focus(k.id); }
      }
      drag = null;
    };
    cv.addEventListener('pointerup', end);
    cv.addEventListener('pointercancel', end);
    cv.addEventListener('pointerleave', () => { if (!drag) { tip.hidden = true; cv.classList.remove('hot'); } });
    cv.addEventListener('wheel', e => {
      e.preventDefault();
      user.zoom = Math.min(4, Math.max(0.25, user.zoom * Math.exp(e.deltaY * 0.0012))); user.last = clock;
      if (!running) frame(performance.now());
    }, { passive: false });
    btnPause.onclick = () => { if (prog >= END - 0.01) replay(); else paused = !paused; };
    $('.an-replay').onclick = replay;
  }
  function replay() {
    prog = reduce ? END : 0; paused = false; sumClosed = false; sum.hidden = true; shownG = -1; numFrom = numTo = 1; numT = 1; numTxt = '';
    user.th = 0; user.ph = 0; user.zoom = 1; autoClock = 0; cam.th = 0; cam.ph = 1.62; cam.ty = 0;
    if (!running) start();
  }

  // ---------- loop ----------
  function frame(now) {
    if (lastT && running) adapt(now - lastT);
    const dt = Math.min(0.1, Math.max(0, (now - lastT) / 1000)); lastT = now;
    clock += dt;
    if (!paused && prog < END) { const k = Math.min(1, Math.max(0, (prog - 2) / 1.5)), ease = k * k * (3 - 2 * k); prog = Math.min(END, prog + dt / (2.1 - 0.75 * ease)); }
    lineMat.uniforms.uProg.value = prog;
    ptsMat.uniforms.uProg.value = prog;
    ptsMat.uniforms.uTime.value = clock;
    const d = updateCamera(dt);
    composer.render();
    updateHud(dt);
    updateLabels(d);
  }
  function loop(now) { if (!running) return; frame(now); raf = requestAnimationFrame(loop); }
  function load() {
    if (loading) return loading;
    const B = 'https://cdn.jsdelivr.net/npm/three@0.160.0/';
    loading = Promise.all([
      import(B + '+esm'),
      import(B + 'examples/jsm/postprocessing/EffectComposer.js/+esm'),
      import(B + 'examples/jsm/postprocessing/RenderPass.js/+esm'),
      import(B + 'examples/jsm/postprocessing/UnrealBloomPass.js/+esm'),
      import(B + 'examples/jsm/postprocessing/OutputPass.js/+esm')
    ]).then(([T, ec, rp, ub, op]) => {
      three = { T, EffectComposer: ec.EffectComposer, RenderPass: rp.RenderPass, UnrealBloomPass: ub.UnrealBloomPass, OutputPass: op.OutputPass };
      build();
    });
    return loading;
  }
  function fail(err) {
    failed = true; running = false;
    if (window.console) console.warn('[animace]', err);
    host.innerHTML = '<div class="an-err">3D animaci se nepodařilo načíst (je potřeba připojení k internetu a WebGL).</div>';
  }
  function start() {
    if (failed || running) return;
    running = true;
    load().then(() => {
      if (!running) return;
      resize(); lastT = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
    }).catch(fail);
  }
  function stop() { running = false; cancelAnimationFrame(raf); if (tip) tip.hidden = true; }
  window.RV_anim = { start, stop, replay, get prog() { return prog; }, get running() { return running; }, G, implex: implex.map(x => x.id), known: knownAnc.size };
  if (host.classList.contains('on')) start();
})();
</script>
</body>
</html>
